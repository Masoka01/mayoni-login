<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard App</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body
    class="bg-slate-100 dark:bg-slate-900 flex flex-col items-center justify-center min-h-screen relative p-4"
  >
    <button
      id="themeToggle"
      class="absolute top-4 right-4 p-2 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-yellow-400 rounded-full shadow-md hover:bg-slate-300 dark:hover:bg-slate-700 transition"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>

    <div
      class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-custom w-full max-w-lg border border-transparent dark:border-slate-700 text-center"
    >
      <div
        class="w-16 h-16 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full flex items-center justify-center mx-auto mb-4"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 class="text-3xl font-bold mb-2 text-slate-800 dark:text-white">
        Akses Diberikan!
      </h2>
      <p class="text-slate-600 dark:text-slate-400 mb-6">
        Selamat datang di area sistem. Anda login sebagai:<br /><strong
          id="userDisplay"
          class="text-blue-600 dark:text-blue-400 mt-2 block font-mono"
        ></strong>
      </p>

      <button
        id="logoutBtn"
        class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-semibold py-2 px-6 rounded-lg transition duration-200"
      >
        Keluar Akun
      </button>
    </div>

    <script src="/assets/js/main.js"></script>
  </body>
</html>
