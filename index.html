<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
      <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">
        Masuk Akun
      </h2>

      <div
        id="alert"
        class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center"
      ></div>

      <form id="loginForm">
        <div class="mb-4">
          <label
            class="block text-slate-700 text-sm font-semibold mb-2"
            for="email"
            >Email</label
          >
          <input
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            id="email"
            type="email"
            placeholder="nama@email.com"
            required
          />
        </div>
        <div class="mb-6">
          <label
            class="block text-slate-700 text-sm font-semibold mb-2"
            for="password"
            >Password</label
          >
          <input
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            id="password"
            type="password"
            placeholder="••••••••"
            required
          />
        </div>
        <button
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200"
          type="submit"
          id="submitBtn"
        >
          Masuk
        </button>
      </form>
    </div>

    <script>
      // Bagian ini jalanin jQuery setelah halaman selesai dimuat
      $(document).ready(function () {
        // Ketika tombol "Masuk" di-klik
        $("#loginForm").submit(function (e) {
          e.preventDefault(); // Mencegah halaman ke-refresh

          const btn = $("#submitBtn");
          const alertBox = $("#alert");

          // Ubah tombol jadi "Memproses..." biar user tau sistem lagi jalan
          btn
            .text("Memproses...")
            .prop("disabled", true)
            .addClass("opacity-70");
          alertBox
            .addClass("hidden")
            .removeClass("bg-red-100 text-red-700 bg-green-100 text-green-700");

          // Ambil data dari kolom isian
          const payload = {
            email: $("#email").val(),
            password: $("#password").val(),
          };

          // Kirim data ke satpam kita (file login.js di folder api)
          $.ajax({
            url: "/api/login",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (response) {
              // Kalau dapet lampu hijau (sukses)
              alertBox
                .text(response.message)
                .addClass("bg-green-100 text-green-700")
                .removeClass("hidden");
              btn
                .text("Masuk")
                .prop("disabled", false)
                .removeClass("opacity-70");
            },
            error: function (xhr) {
              // Kalau ditolak (error)
              const errorMsg = xhr.responseJSON
                ? xhr.responseJSON.error
                : "Terjadi kesalahan pada server.";
              alertBox
                .text(errorMsg)
                .addClass("bg-red-100 text-red-700")
                .removeClass("hidden");
              btn
                .text("Masuk")
                .prop("disabled", false)
                .removeClass("opacity-70");
            },
          });
        });
      });
    </script>
  </body>
</html>
