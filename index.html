<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Portofolio</title>

    <link rel="stylesheet" href="/assets/css/style.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class", // Wajib biar toggle dark mode via JS berfungsi
      };
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body
    class="bg-slate-100 dark:bg-slate-900 flex items-center justify-center min-h-screen relative"
  >
    <button
      id="themeToggle"
      class="absolute top-4 right-4 p-2 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-yellow-400 rounded-full shadow-md hover:bg-slate-300 dark:hover:bg-slate-700 transition"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>

    <div
      class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-custom w-full max-w-sm border border-transparent dark:border-slate-700"
    >
      <h2
        class="text-2xl font-bold mb-2 text-center text-slate-800 dark:text-white"
      >
        Masuk Akun
      </h2>
      <p class="text-center text-slate-500 dark:text-slate-400 text-sm mb-6">
        Demo Portofolio
      </p>

      <div
        class="mb-6 p-4 bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg text-blue-800 dark:text-blue-300"
      >
        <strong class="block mb-3 text-sm"
          >Gunakan akses ini untuk mencoba:</strong
        >

        <div
          class="flex items-center justify-between mb-2 bg-white dark:bg-slate-800 p-2 rounded-md border border-blue-100 dark:border-blue-800"
        >
          <div>
            <span
              class="text-[10px] uppercase font-bold tracking-wider opacity-70 block mb-1"
              >Email</span
            >
            <span class="font-mono text-sm" id="demoEmail"
              >recapdata8@gmail.com</span
            >
          </div>
          <button
            type="button"
            class="copy-btn bg-blue-100 hover:bg-blue-200 dark:bg-blue-800 dark:hover:bg-blue-700 text-blue-700 dark:text-blue-200 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm"
            data-target="demoEmail"
          >
            Copy
          </button>
        </div>

        <div
          class="flex items-center justify-between bg-white dark:bg-slate-800 p-2 rounded-md border border-blue-100 dark:border-blue-800"
        >
          <div>
            <span
              class="text-[10px] uppercase font-bold tracking-wider opacity-70 block mb-1"
              >Password</span
            >
            <span class="font-mono text-sm" id="demoPass">admin123</span>
          </div>
          <button
            type="button"
            class="copy-btn bg-blue-100 hover:bg-blue-200 dark:bg-blue-800 dark:hover:bg-blue-700 text-blue-700 dark:text-blue-200 px-3 py-1.5 rounded text-xs font-bold transition shadow-sm"
            data-target="demoPass"
          >
            Copy
          </button>
        </div>
      </div>

      <div
        id="alert"
        class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center"
      ></div>

      <form id="loginForm">
        <div class="mb-4">
          <label
            class="block text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2"
            for="email"
            >Email</label
          >
          <input
            class="w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-400 dark:placeholder-slate-500"
            id="email"
            type="email"
            placeholder="nama@email.com"
            required
          />
        </div>
        <div class="mb-6">
          <label
            class="block text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2"
            for="password"
            >Password</label
          >
          <input
            class="w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-400 dark:placeholder-slate-500"
            id="password"
            type="password"
            placeholder="••••••••"
            required
          />
        </div>
        <button
          class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200"
          type="submit"
          id="submitBtn"
        >
          Masuk
        </button>
      </form>
    </div>

    <script src="/assets/js/main.js"></script>
  </body>
</html>
